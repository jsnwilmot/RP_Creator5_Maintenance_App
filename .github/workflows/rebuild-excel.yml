name: Rebuild Creator 5 Excel workbook

on:
  push:
    branches:
      - main
    paths:
      - "build/excel/ghchunk07.b64"

permissions:
  contents: write

jobs:
  rebuild-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and validate workbook
        shell: bash
        run: |
          set -euo pipefail
          cat build/excel/ghchunk*.b64 | base64 --decode > excel/Rose_and_Paw_Creator5_Maintenance_App.xlsx
          unzip -t excel/Rose_and_Paw_Creator5_Maintenance_App.xlsx
          ACTUAL_SHA="$(sha256sum excel/Rose_and_Paw_Creator5_Maintenance_App.xlsx | awk '{print $1}')"
          EXPECTED_SHA="f76c5ebc548c8e37b3cc11ba309276a6f9981b047685863ff6d85edd18d22be6"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Commit repaired workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f build/excel/ghchunk*.b64 build/excel/part*.b64 || true
          git add excel/Rose_and_Paw_Creator5_Maintenance_App.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Excel workbook binary"
          git push
